[package]
name = "wysityp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wysityp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri-plugin-dialog = "2"
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
typst-library = "0.15"
typst-syntax = "0.15"
typst-utils = "0.15"
typst-kit = { version = "0.15", features = ["embedded-fonts", "scan-fonts", "system-files", "system-packages", "universe-packages", "system-downloader", "datetime"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "0.0.13"
thiserror = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
comemo = "0.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
