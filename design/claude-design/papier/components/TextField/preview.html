<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>TextField</title></head>
<body class="wt">
<div class="wt-stage col" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start">
<div class="wt-field"><label style="position:absolute;clip-path:inset(50%)">Szukaj</label><div class="wt-control"><span class="lead"><svg class="wt-ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span><input class="wt-input icon" placeholder="Szukaj w notatkach…"></div></div>
<div class="wt-field"><label>Nazwa notatki</label><input class="wt-input focus" value="wyklad-07"><p class="wt-msg">Plik zostanie zapisany jako .typ w wybranym folderze.</p></div>
<div class="wt-field invalid"><label>Nazwa notatki</label><input class="wt-input" value="analiza/../x" aria-invalid="true"><p class="wt-msg" role="alert"><svg class="wt-ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4"/><circle cx="12" cy="17" r=".5"/></svg>Nazwa nie może wychodzić poza otwarty folder.</p></div>
</div>
</body>
</html>
