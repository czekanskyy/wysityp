<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>CommandPalette</title></head>
<body class="wt">
<div class="wt-stage" style="justify-content:center;background:var(--color-overlay);padding:24px">
<div class="wt-palette" role="dialog" aria-label="Paleta poleceń">
<div class="q"><svg class="wt-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><b>wst</b></div>
<div class="list" role="listbox" aria-label="Paleta poleceń">
<div class="grp">Wstaw</div>
<div class="wt-opt" role="option" aria-selected="false"><span class="ic"><svg class="wt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5H7l6 7-6 7h11"/></svg></span><span class="t">Wstaw wzór</span><span class="wt-kbd"><kbd>Ctrl</kbd><kbd>M</kbd></span></div>
<div class="wt-opt" role="option" aria-selected="true"><span class="ic"><svg class="wt-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M3 15h18"/><path d="M10 4v16"/></svg></span><span class="t">Wstaw tabelę</span></div>
<div class="wt-opt" role="option" aria-selected="false"><span class="ic"><svg class="wt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/></svg></span><span class="t">Wstaw blok kodu</span></div>
</div>
<div class="foot"><span><span class="wt-kbd"><kbd>↑</kbd><kbd>↓</kbd></span> wybierz</span><span><span class="wt-kbd"><kbd>Enter</kbd></span> uruchom</span><span><span class="wt-kbd"><kbd>Esc</kbd></span> zamknij</span></div>
</div></div>
</body>
</html>
