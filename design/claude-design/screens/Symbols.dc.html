<style>
body{margin:0}
.pop{position:absolute;left:600px;top:92px;width:600px;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;font-family:var(--font-ui);color:var(--color-text)}
.pop::before{content:"";position:absolute;left:24px;top:-6px;width:10px;height:10px;background:var(--color-surface-raised);border-left:1px solid var(--color-border);border-top:1px solid var(--color-border);transform:rotate(45deg)}
.head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.srch{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--color-border);border-radius:7px;background:var(--color-surface);font-size:13px;color:var(--color-text-faint)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--color-border);overflow:hidden}
.tab{border:0;background:transparent;padding:8px 9px 9px;font:500 12.5px var(--font-ui);color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--color-text)}
.tab[aria-selected="true"]{color:var(--color-accent-text);border-bottom-color:var(--color-accent)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 176px;min-height:300px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:12px;align-content:start}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border:1px solid transparent;border-radius:7px;background:transparent;cursor:pointer;color:var(--color-text);min-width:0}
.cell:hover{background:var(--color-hover)}
.cell[aria-selected="true"]{background:var(--color-accent-soft);border-color:var(--color-accent)}
.g{font:22px/1 var(--font-math);color:var(--color-math)}
.cell[aria-selected="true"] .g{color:var(--color-accent-text)}
.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:10px var(--font-mono);color:var(--color-text-faint)}
.det{border-left:1px solid var(--color-border);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--color-surface-sunken)}
.big{height:84px;display:grid;place-items:center;background:var(--color-surface);border:1px solid var(--color-border);border-radius:9px;font:44px/1 var(--font-math);color:var(--color-math)}
.kv{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--color-text-muted)}
.kv code{font:12.5px var(--font-mono);color:var(--color-code-text);background:var(--color-code-bg);padding:2px 5px;border-radius:4px;align-self:flex-start}
.foot{display:flex;align-items:center;gap:14px;padding:8px 12px;border-top:1px solid var(--color-border);font-size:11.5px;color:var(--color-text-muted)}
.foot .wt-kbd{margin-right:3px}
</style>
